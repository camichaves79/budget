<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b3022" />
    <meta
      name="description"
      content="Your simple budget tracker — record income and expenses in seconds, privately, right on your phone."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="$5 Budget" />
    <!-- Social share previews (og-share-preview): WhatsApp/Telegram/iMessage
         read og:*; Twitter/X and some others read twitter:* fallbacks. The
         image must be an ABSOLUTE URL — crawlers fetch it from prod. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="$5 Budget" />
    <meta property="og:title" content="$5 Budget" />
    <meta
      property="og:description"
      content="Your simple budget tracker — record income and expenses in seconds, privately, right on your phone."
    />
    <meta property="og:url" content="https://5budget.app/" />
    <meta property="og:image" content="https://5budget.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="$5 Budget — your simple budget tracker" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="$5 Budget" />
    <meta
      name="twitter:description"
      content="Your simple budget tracker — record income and expenses in seconds, privately, right on your phone."
    />
    <meta name="twitter:image" content="https://5budget.app/og.png" />
    <title>$5 Budget</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
