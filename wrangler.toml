# Cloudflare Worker config (hosting migration A15, Phase 2).
# The six Vercel Functions become routes of this ONE worker — see worker.js.
# nodejs_compat provides Buffer + node:crypto for the api modules; the
# compatibility date pins the v2 compat layer.
name = "budget-api"
main = "worker.js"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# NON-SECRET configuration, declared HERE on purpose (2026-09-11).
#
# `deploy-worker.yml` runs `wrangler deploy` on every push to `main`. That
# uploads this file's bindings, and a PLAIN-TEXT variable that exists only in
# the dashboard is overwritten by it, while SECRETS survive it (Cloudflare
# cannot re-send a secret it never sees). Measured, with the exact symptom:
# `GOOGLE_PLAY_PACKAGE_NAME` was set in the dashboard at ~18:00 on 2026-09-11
# and was gone again by 22:15 — the live Worker answered
# `GOOGLE_PLAY_PACKAGE_NAME is not set on the worker` — after four pushes to
# `main`. `GOOGLE_PLAY_SERVICE_ACCOUNT`, `FIREBASE_SERVICE_ACCOUNT` and
# `BUDGET_PARSE_SECRET` (all secrets) were untouched.
#
# Why that matters more than a 503: with an empty package name the Play URL
# collapses to `.../applications//purchases/subscriptions/...`, which Google
# answers with the generic `400 Invalid Value` — the same answer a bad purchase
# token gets. Before v0.3.6 nothing logged it, which is the shape of the
# unexplained 400 behind the two charged-but-unlicensed purchases.
#
# Reference: cloudflare/workers-sdk#8871 and #4453 (`--keep-vars` was added for
# this class of loss). Declaring the values here removes the failure mode
# instead of relying on every future deploy remembering them.
#
# NOTE: top-level vars are inherited by `[env.staging]`, so the staging Worker
# receives these two names as well. That cannot enable a purchase there — the
# staging frontend ships no `VITE_PLAY_SUBSCRIPTION_ID`, so the Play button
# never renders and the endpoint is never called.
# ---------------------------------------------------------------------------
[vars]
GOOGLE_PLAY_PACKAGE_NAME = "app.fivebudget"
GOOGLE_PLAY_SUBSCRIPTION_ID = "smart_entry_yearly"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Staging (2026-09, environment separation).
#
# A SECOND Worker from the same code, so development can never reach
# api.5budget.app. Deployed by .github/workflows/deploy-worker-staging.yml on
# pushes to the `staging` branch (or manually). The production Worker above is
# the default environment and is untouched by `--env staging`.
#
# `npx wrangler deploy --env staging` creates the Worker; its secrets are set
# on the Worker in the dashboard (Settings → Variables and Secrets), exactly
# like production. The custom domain `api-staging.5budget.app` is attached in
# the dashboard too (Workers → budget-api-staging → Settings → Domains &
# Routes) — deliberately NOT declared here, mirroring production and keeping
# the deploy independent of the API token's DNS permissions.
#
# Data: staging shares the production Firebase project, so the client-side
# money path is disabled there by simply NOT setting VITE_CHECKOUT_URL /
# VITE_PLAY_SUBSCRIPTION_ID in the Pages Preview environment (the licence
# section stays inert) — nothing can mint a licence or write a ledger row.
# ---------------------------------------------------------------------------
[env.staging]
name = "budget-api-staging"
main = "worker.js"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]

[env.staging.observability]
enabled = true
