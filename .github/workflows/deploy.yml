# Builds the app and deploys the dist/ folder to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Smart-entry parse microservice + paywall/license config (baked into
          # the bundle at build time). Unset secrets build fine — smart entry
          # shows a "not set up" hint and the paywall card degrades gracefully.
          VITE_PARSE_ENDPOINT: ${{ secrets.VITE_PARSE_ENDPOINT }}
          VITE_PARSE_SECRET: ${{ secrets.VITE_PARSE_SECRET }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CHECKOUT_URL: ${{ secrets.VITE_CHECKOUT_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Turns on Pages (source: GitHub Actions) if it isn't enabled yet.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
